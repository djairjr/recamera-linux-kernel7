# Sophgo video codec driver (F7). Each /dev/cvi_vc_encN is an encoder
# channel; its codec (JPEG, H.264, H.265) is chosen when the channel is
# created, so 3 channels allow e.g. MJPEG + H.264 + one more at once (the
# vendor default is 16 encoders + 64 decoders). No decoding on the camera.
options cvi_vc_driver MaxVencChnNum=3 MaxVdecChnNum=0
