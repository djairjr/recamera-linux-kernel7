# udhcpd for usb0 -- the vendor's /etc/dnsmasq/usb_only.conf in busybox terms:
#   interface=usb0, listen-address=192.168.42.1,
#   dhcp-range=192.168.42.10,192.168.42.242,12h, dhcp-option=3,192.168.42.1
interface	usb0
start		192.168.42.10
end		192.168.42.242
max_leases	233
lease_file	/var/lib/misc/udhcpd.leases
option	subnet	255.255.255.0
option	router	192.168.42.1
option	lease	43200
