# SD card image of the reCamera (SG2002): the layout the board reads.
#
# Same scheme as the genimage.cfg of reCamera-OS
# (build/tools/common/sd_tools/genimage.cfg) and Buildroot's
# board/raspberrypi/genimage.cfg.in: p1 FAT with fip.bin and the kernel FIT,
# p2 ext4 with the rootfs.
#
# p1 is what the boot ROM reads: fip.bin (FSBL + OpenSBI + U-Boot) is a FILE
# in the FAT (U-Boot 2026.04 doc/board/sophgo/licheerv_nano.rst: "Place the
# generated fip.bin file into the FAT partition of the SD card"). U-Boot then
# loads boot.sd from the same FAT by name (fatload mmc 1 boot.sd) and mounts
# p2 as root (root=/dev/mmcblk1p2).
#
# p1 is 64M (the vendor release uses 8M): 8M of FAT12 cannot hold two copies
# of the FIT, and replacing boot.sd in place fragments the file -- the vendor
# U-Boot then fails with "Invalid FAT entry" (measured on 18/10/2026).
# p2 has no size: genimage takes the size of Buildroot's rootfs.ext4.
#
# p3 INSTALL: what /usr/sbin/emmc-install writes to the eMMC (fip, FIT,
# rootfs, U-Boot environment) with SHA256SUMS. See docs/emmc-layout.md.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"fip.bin",
			"boot.sd",
		}
	}

	size = 64M
}

image install.vfat {
	vfat {
		extraargs = "-F 32"
		label = "INSTALL"
		files = {
			"fip.bin",
			"boot.itb",
			"rootfs.ext4",
			"uboot-env.bin",
			"SHA256SUMS",
			"VERSION",
		}
	}

	size = 320M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		# the vendor release starts p1 at LBA 2048 (1M); without this
		# genimage starts p1 at LBA 1 and p2 moves from 18432 to 16385
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition install {
		partition-type = 0xC
		image = "install.vfat"
	}
}
